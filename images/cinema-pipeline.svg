<svg viewBox="0 0 800 254" xmlns="http://www.w3.org/2000/svg"
     font-family="Segoe UI, system-ui, -apple-system, Helvetica, sans-serif">
<defs>
  <marker id="cah" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#33406B"/>
  </marker>
</defs>

<rect width="800" height="254" fill="#0D1322"/>

<text x="32" y="40" fill="#EAEEF9" font-size="17" font-weight="600" letter-spacing="-.3">From scanned statements to a clear model</text>
<text x="32" y="62" fill="#6E7899" font-size="12">Four steps, and only the first one was somebody else's format</text>

<!-- where it starts: paper, and the only red box in the row -->
<g>
  <rect x="32" y="88" width="156" height="102" rx="12" fill="#1A1016" stroke="#FB7185" stroke-opacity=".55"/>
  <rect x="32" y="88" width="4" height="102" rx="2" fill="#FB7185"/>
  <text x="50" y="118" fill="#FB7185" font-size="14" font-weight="600">Scanned FS</text>
  <text x="50" y="142" fill="#A3ADC9" font-size="12">hard copy pages</text>
  <text x="50" y="162" fill="#A3ADC9" font-size="12">transcribed by hand</text>
</g>
<line x1="194" y1="139" x2="226" y2="139" stroke="#33406B" stroke-width="2" marker-end="url(#cah)"/>

<g>
  <rect x="232" y="88" width="156" height="102" rx="12" fill="#121828" stroke="#33406B"/>
  <rect x="232" y="88" width="4" height="102" rx="2" fill="#5B8CFF"/>
  <text x="250" y="118" fill="#EAEEF9" font-size="14" font-weight="600">Structured data</text>
  <text x="250" y="142" fill="#A3ADC9" font-size="12">digitised, cleaned</text>
  <text x="250" y="162" fill="#A3ADC9" font-size="12">one basis throughout</text>
</g>
<line x1="394" y1="139" x2="426" y2="139" stroke="#33406B" stroke-width="2" marker-end="url(#cah)"/>

<g>
  <rect x="432" y="88" width="156" height="102" rx="12" fill="#121828" stroke="#33406B"/>
  <rect x="432" y="88" width="4" height="102" rx="2" fill="#A78BFA"/>
  <text x="450" y="118" fill="#EAEEF9" font-size="14" font-weight="600">Valuation</text>
  <text x="450" y="142" fill="#A3ADC9" font-size="12">EBITDA multiple</text>
  <text x="450" y="162" fill="#A3ADC9" font-size="12">normalised earnings</text>
</g>
<line x1="594" y1="139" x2="626" y2="139" stroke="#33406B" stroke-width="2" marker-end="url(#cah)"/>

<!-- where it ends: the thing the client could actually decide on -->
<g>
  <rect x="632" y="88" width="136" height="102" rx="12" fill="#04140E" stroke="#34D399" stroke-opacity=".5"/>
  <rect x="632" y="88" width="4" height="102" rx="2" fill="#34D399"/>
  <text x="650" y="118" fill="#34D399" font-size="14" font-weight="600">Scenarios</text>
  <text x="650" y="142" fill="#A3ADC9" font-size="12">low / mid / high</text>
  <text x="650" y="162" fill="#A3ADC9" font-size="12">per target</text>
</g>

<text x="32" y="226" fill="#6E7899" font-size="12">Every number in the last box can be traced back to a page in the first one.</text>
</svg>
