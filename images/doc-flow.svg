<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="680" height="600" rx="0" fill="#141417"/>
<title>Financial KPI Dashboard: data pipeline from SAP to Power BI</title>
<desc>Six-step vertical pipeline: SAP queries produce reports in the New Downloads folder, processed by DataProcessor into Revenue/Expenditure/Invoices CSVs, archived, imported by the Power BI shared dataset, driving the KPI Dashboard.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<!-- BOX 1 — SAP -->
<g>
  <rect x="170" y="20" width="340" height="68" rx="0" fill="#1A1A1F" stroke="#45454F" stroke-width="1.5"/>
  <line x1="176" y1="30" x2="176" y2="78" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
  <text x="350" y="45" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" fill="#EDEDF0">SAP System</text>
  <text x="350" y="66" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="11" fill="#9A9AA6">Queries to SAP reports</text>
</g>
<!-- ARROW 1 -->
<line x1="340" y1="88" x2="340" y2="111" stroke="#45454F" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="230" y="91" width="220" height="20" rx="0" fill="#141417" stroke="#383843" stroke-width="0.5"/>
<text x="340" y="101" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="10" fill="#9A9AA6" font-style="italic">SAP report export</text>
<!-- BOX 2 — New Downloads -->
<g>
  <rect x="170" y="118" width="340" height="68" rx="0" fill="#1A1A1F" stroke="#45454F" stroke-width="1.5"/>
  <line x1="176" y1="128" x2="176" y2="176" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
  <text x="350" y="143" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" fill="#EDEDF0">New Downloads Folder</text>
  <text x="350" y="164" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="11" fill="#9A9AA6">Raw SAP reports landing zone</text>
</g>
<!-- ARROW 2 -->
<line x1="340" y1="186" x2="340" y2="209" stroke="#45454F" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="215" y="189" width="250" height="20" rx="0" fill="#141417" stroke="#383843" stroke-width="0.5"/>
<text x="340" y="199" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="10" fill="#9A9AA6" font-style="italic">DataProcessor / gui_app.py</text>
<!-- BOX 3 — Script Processing -->
<g>
  <rect x="170" y="216" width="340" height="68" rx="0" fill="#1F1F26" stroke="#45454F" stroke-width="1.5"/>
  <line x1="176" y1="226" x2="176" y2="274" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
  <text x="350" y="241" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" fill="#EDEDF0">Script Processing</text>
  <text x="350" y="262" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="11" fill="#9A9AA6">Parse, transform, validate, archive</text>
</g>
<!-- ARROW 3 -->
<line x1="340" y1="284" x2="340" y2="307" stroke="#45454F" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="205" y="287" width="270" height="20" rx="0" fill="#141417" stroke="#383843" stroke-width="0.5"/>
<text x="340" y="297" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="10" fill="#9A9AA6" font-style="italic">Revenue.csv · Expenditure.csv · (Invoices.csv)</text>
<!-- BOX 4 — CSV Output + Archive -->
<g>
  <rect x="170" y="314" width="340" height="68" rx="0" fill="#1F1F26" stroke="#45454F" stroke-width="1.5"/>
  <line x1="176" y1="324" x2="176" y2="372" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
  <text x="350" y="339" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" fill="#EDEDF0">CSV Output + Archive</text>
  <text x="350" y="360" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="11" fill="#9A9AA6">Data/ folder · processed files archived</text>
</g>
<!-- ARROW 4 -->
<line x1="340" y1="382" x2="340" y2="405" stroke="#45454F" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="225" y="385" width="230" height="20" rx="0" fill="#141417" stroke="#383843" stroke-width="0.5"/>
<text x="340" y="395" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="10" fill="#9A9AA6" font-style="italic">Power Query import / scheduled refresh</text>
<!-- BOX 5 — Shared Dataset -->
<g>
  <rect x="170" y="412" width="340" height="68" rx="0" fill="#1A1A1F" stroke="#45454F" stroke-width="1.5"/>
  <line x1="176" y1="422" x2="176" y2="470" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
  <text x="350" y="437" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" fill="#EDEDF0">Power BI Shared Dataset</text>
  <text x="350" y="458" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="11" fill="#9A9AA6">DatasetId: ab5a22c5...0dde24776b53</text>
</g>
<!-- ARROW 5 -->
<line x1="340" y1="480" x2="340" y2="503" stroke="#45454F" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="265" y="483" width="150" height="20" rx="0" fill="#141417" stroke="#383843" stroke-width="0.5"/>
<text x="340" y="493" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="10" fill="#9A9AA6" font-style="italic">Live connection</text>
<!-- BOX 6 — Dashboard -->
<g>
  <rect x="170" y="510" width="340" height="68" rx="0" fill="#1A1A1F" stroke="#45454F" stroke-width="1.5"/>
  <line x1="176" y1="520" x2="176" y2="568" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
  <text x="350" y="535" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" fill="#EDEDF0">KPI Dashboard</text>
  <text x="350" y="556" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="11" fill="#9A9AA6">PBIX · Live connection</text>
</g>
</svg>
