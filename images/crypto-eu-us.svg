<svg viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
<style>
.bar{transform-origin:center bottom;animation:rise 1.3s cubic-bezier(.22,.9,.3,1) forwards;transform:scaleY(0)}
.bn{transform-origin:center top;animation:rise 1.3s cubic-bezier(.22,.9,.3,1) forwards;transform:scaleY(0)}
@keyframes rise{0%{transform:scaleY(0)}70%{transform:scaleY(1.04)}100%{transform:scaleY(1)}}
.dot{opacity:0;animation:fade .5s ease forwards .9s}
@keyframes fade{to{opacity:1}}
</style>
<rect width="780" height="430" rx="14" fill="#11162B"/>
<text x="34" y="34" fill="#E8EAF2" font-size="15" font-weight="bold">Estimated regulatory effect on monthly returns</text>
<text x="34" y="54" fill="#9AA3B8" font-size="11">Fama and French model with a regulation dummy · top 5 cryptoassets · coefficient (β)</text>
<!-- plot frame -->
<rect x="70" y="80" width="676" height="250" fill="none" stroke="#2a3354" stroke-width="1.2"/>
<!-- y gridlines + ticks (β from -0.10 to +0.25) -->
<g stroke="#222a44" stroke-width="1">
<line x1="70" y1="120" x2="746" y2="120"/><line x1="70" y1="170" x2="746" y2="170"/>
<line x1="70" y1="220" x2="746" y2="220"/><line x1="70" y1="270" x2="746" y2="270"/></g>
<g fill="#6b7394" font-size="10" text-anchor="end">
<text x="62" y="124">+0.20</text><text x="62" y="174">+0.10</text>
<text x="62" y="224">0.00</text><text x="62" y="274">-0.10</text></g>
<text x="30" y="210" fill="#6b7394" font-size="10" transform="rotate(-90 30 210)">coefficient (β)</text>
<!-- zero baseline emphasised -->
<line x1="70" y1="220" x2="746" y2="220" stroke="#3a4668" stroke-width="1.6"/>
<!-- bars: EU positive (above zero), US ~ zero -->
<!-- EU MiCA +0.18 -> top at 220-90=130 -->
<rect class="bar" x="120" y="130" width="70" height="90" rx="3" fill="#4FD1C5"/>
<text x="155" y="122" fill="#4FD1C5" font-size="12" text-anchor="middle" font-weight="bold">+0.18</text>
<text x="155" y="346" fill="#cfd3e0" font-size="10" text-anchor="middle">EU · MiCA</text>
<!-- EU pre +0.11 -> 220-55=165 -->
<rect class="bar" x="250" y="165" width="70" height="55" rx="3" fill="#4FD1C5" opacity=".82" style="animation-delay:.15s"/>
<text x="285" y="157" fill="#4FD1C5" font-size="12" text-anchor="middle" font-weight="bold">+0.11</text>
<text x="285" y="346" fill="#9AA3B8" font-size="10" text-anchor="middle">EU · pre-MiCA</text>
<!-- US enforce -0.03 -> 220..235 -->
<rect class="bn" x="430" y="220" width="70" height="15" rx="3" fill="#8B9BFF" style="animation-delay:.3s"/>
<text x="465" y="252" fill="#8B9BFF" font-size="12" text-anchor="middle" font-weight="bold">-0.03</text>
<text x="465" y="346" fill="#cfd3e0" font-size="10" text-anchor="middle">US · enforcement</text>
<!-- US guidance -0.01 -> 220..225 -->
<rect class="bn" x="560" y="220" width="70" height="6" rx="3" fill="#8B9BFF" opacity=".82" style="animation-delay:.45s"/>
<text x="595" y="240" fill="#8B9BFF" font-size="12" text-anchor="middle" font-weight="bold">-0.01</text>
<text x="595" y="346" fill="#9AA3B8" font-size="10" text-anchor="middle">US · guidance</text>
<!-- divider EU | US -->
<line x1="375" y1="86" x2="375" y2="324" stroke="#2a3354" stroke-width="1" stroke-dasharray="3 4"/>
<text x="120" y="384" fill="#6b7394" font-size="10">EU effects significant at 5% · US effects not distinguishable from zero</text>
<g font-size="11"><rect x="600" y="26" width="12" height="12" fill="#4FD1C5"/><text x="618" y="36" fill="#E8EAF2">EU</text>
<rect x="668" y="26" width="12" height="12" fill="#8B9BFF"/><text x="686" y="36" fill="#E8EAF2">US</text></g>
</svg>
