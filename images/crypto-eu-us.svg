<svg viewBox="0 0 800 396" xmlns="http://www.w3.org/2000/svg"
     font-family="Segoe UI, system-ui, -apple-system, Helvetica, sans-serif">
<defs>
  <linearGradient id="eub" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7BA2FF"/><stop offset="1" stop-color="#5B8CFF"/>
  </linearGradient>
  <linearGradient id="usb" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6E7899"/><stop offset="1" stop-color="#4A5474"/>
  </linearGradient>
</defs>

<rect width="800" height="396" fill="#0D1322"/>

<text x="36" y="38" fill="#EAEEF9" font-size="17" font-weight="600" letter-spacing="-.3">Estimated regulatory effect on monthly returns</text>
<text x="36" y="60" fill="#A3ADC9" font-size="12">Fama and French model with a regulation dummy &#183; top five cryptoassets &#183; coefficient &#946;</text>

<!-- legend -->
<g font-size="12">
  <rect x="596" y="26" width="11" height="11" rx="3" fill="#5B8CFF"/>
  <text x="614" y="36" fill="#A3ADC9">EU</text>
  <rect x="664" y="26" width="11" height="11" rx="3" fill="#6E7899"/>
  <text x="682" y="36" fill="#A3ADC9">US</text>
</g>

<g stroke="#1A2238" stroke-width="1">
  <line x1="84" y1="120" x2="762" y2="120"/>
  <line x1="84" y1="170" x2="762" y2="170"/>
  <line x1="84" y1="270" x2="762" y2="270"/>
</g>
<g fill="#6E7899" font-size="11" text-anchor="end">
  <text x="74" y="124">+0.20</text><text x="74" y="174">+0.10</text>
  <text x="74" y="224">0.00</text><text x="74" y="274">&#8722;0.10</text>
</g>
<text x="30" y="200" fill="#6E7899" font-size="11" transform="rotate(-90 30 200)">coefficient &#946;</text>

<!-- the zero line carries the whole finding, so it is the strongest rule here -->
<line x1="84" y1="220" x2="762" y2="220" stroke="#4A5474" stroke-width="1.6"/>

<!-- EU: both bars clear of zero -->
<rect x="128" y="130" width="76" height="90" rx="4" fill="url(#eub)"/>
<text x="166" y="120" fill="#7BA2FF" font-size="14" font-weight="700" text-anchor="middle">+0.18</text>
<text x="166" y="312" fill="#EAEEF9" font-size="12" text-anchor="middle">MiCA</text>
<text x="166" y="330" fill="#6E7899" font-size="11" text-anchor="middle">significant at 5%</text>

<rect x="252" y="165" width="76" height="55" rx="4" fill="url(#eub)" opacity=".72"/>
<text x="290" y="155" fill="#7BA2FF" font-size="14" font-weight="700" text-anchor="middle">+0.11</text>
<text x="290" y="312" fill="#EAEEF9" font-size="12" text-anchor="middle">pre-MiCA</text>
<text x="290" y="330" fill="#6E7899" font-size="11" text-anchor="middle">significant at 5%</text>

<!-- US: both bars sit on the line -->
<rect x="452" y="220" width="76" height="15" rx="4" fill="url(#usb)"/>
<text x="490" y="256" fill="#A3ADC9" font-size="14" font-weight="700" text-anchor="middle">&#8722;0.03</text>
<text x="490" y="312" fill="#A3ADC9" font-size="12" text-anchor="middle">enforcement</text>
<text x="490" y="330" fill="#6E7899" font-size="11" text-anchor="middle">not distinguishable</text>

<rect x="576" y="220" width="76" height="6" rx="3" fill="url(#usb)" opacity=".8"/>
<text x="614" y="247" fill="#A3ADC9" font-size="14" font-weight="700" text-anchor="middle">&#8722;0.01</text>
<text x="614" y="312" fill="#A3ADC9" font-size="12" text-anchor="middle">guidance</text>
<text x="614" y="330" fill="#6E7899" font-size="11" text-anchor="middle">not distinguishable</text>

<!-- the split between the two jurisdictions -->
<line x1="390" y1="86" x2="390" y2="292" stroke="#232C45" stroke-width="1" stroke-dasharray="3 5"/>
<text x="228" y="98" fill="#5B8CFF" font-size="12" font-weight="600" text-anchor="middle">EUROPEAN UNION</text>
<text x="552" y="98" fill="#6E7899" font-size="12" font-weight="600" text-anchor="middle">UNITED STATES</text>

<rect x="84" y="350" width="678" height="30" rx="8" fill="#141B2E" stroke="#232C45"/>
<text x="100" y="370" fill="#A3ADC9" font-size="12">The EU rules moved returns. The US ones did not, and that gap is the whole result.</text>
</svg>
