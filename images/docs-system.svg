<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace" font-size="13"><style>
g[stroke] path{stroke-dasharray:6 6;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
rect[stroke="#4FD1C5"]{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{stroke-opacity:.4}50%{stroke-opacity:.9}}
rect[stroke="#F0A8A8"]{animation:fade 3s ease-in-out infinite}
@keyframes fade{0%,100%{stroke-opacity:.5}50%{stroke-opacity:.25}}
</style>
<rect width="780" height="280" rx="14" fill="#11162B"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8B9BFF"/></marker></defs>
<g stroke="#8B9BFF" stroke-opacity=".35" fill="none"><path d="M250 140h70" marker-end="url(#a)"/></g>
<rect x="40" y="70" width="210" height="60" rx="10" fill="#1B2240" stroke="#8B9BFF" stroke-opacity=".6"/>
<text x="145" y="105" fill="#E8EAF2" text-anchor="middle">QMD templates</text>
<rect x="40" y="150" width="210" height="60" rx="10" fill="#1B2240" stroke="#8B9BFF" stroke-opacity=".6"/>
<text x="145" y="185" fill="#E8EAF2" text-anchor="middle">style.css · house colours</text>
<rect x="320" y="55" width="420" height="170" rx="10" fill="#1B2240" stroke="#4FD1C5" stroke-opacity=".7"/>
<text x="530" y="90" fill="#4FD1C5" text-anchor="middle">Rendered HTML documentation</text>
<text x="530" y="120" fill="#9AA3B8" text-anchor="middle" font-size="11">dynamic table of contents · collapsable sections</text>
<text x="530" y="140" fill="#9AA3B8" text-anchor="middle" font-size="11">cross references between documents</text>
<text x="530" y="160" fill="#9AA3B8" text-anchor="middle" font-size="11">images and graphs that update with the data</text>
<text x="530" y="180" fill="#9AA3B8" text-anchor="middle" font-size="11">identical format, every time, every team</text>
<text x="390" y="35" fill="#E8EAF2" text-anchor="middle" font-size="15">Documentation system</text>
<text x="390" y="255" fill="#9AA3B8" text-anchor="middle" font-size="11">before: Word files, broken links, untracked versions · after: one template, rendered to the web</text>
</svg>
