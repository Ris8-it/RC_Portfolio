<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg"
     font-family="Segoe UI, system-ui, -apple-system, Helvetica, sans-serif">
<defs>
  <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#34D399" stop-opacity=".22"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5B8CFF" stop-opacity=".18"/><stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FB7185" stop-opacity=".14"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="800" height="440" fill="#0D1322"/>

<text x="40" y="38" fill="#EAEEF9" font-size="17" font-weight="600" letter-spacing="-.3">Projected performance after the deal</text>
<text x="40" y="60" fill="#A3ADC9" font-size="12">Indexed against the original standalone case, Year 0 = 100 · three scenarios</text>

<g stroke="#1A2238" stroke-width="1">
  <line x1="84" y1="300" x2="756" y2="300"/><line x1="84" y1="240" x2="756" y2="240"/>
  <line x1="84" y1="180" x2="756" y2="180"/><line x1="84" y1="120" x2="756" y2="120"/>
</g>
<line x1="84" y1="96" x2="84" y2="360" stroke="#33406B" stroke-width="1.4"/>
<line x1="84" y1="360" x2="756" y2="360" stroke="#33406B" stroke-width="1.4"/>

<g fill="#6E7899" font-size="11" text-anchor="end">
  <text x="74" y="364">100</text><text x="74" y="304">110</text><text x="74" y="244">120</text>
  <text x="74" y="184">130</text><text x="74" y="124">140</text>
</g>
<text x="30" y="240" fill="#6E7899" font-size="11" transform="rotate(-90 30 240)">cash flow, indexed</text>
<g fill="#6E7899" font-size="12" text-anchor="middle">
  <text x="84" y="382">Y0</text><text x="252" y="382">Y1</text><text x="420" y="382">Y2</text>
  <text x="588" y="382">Y3</text><text x="740" y="382">Y4</text>
</g>

<path d="M84 360 L252 320 L420 250 L588 175 L740 130 L740 360 L84 360 Z" fill="url(#ga)"/>
<path d="M84 360 L252 335 L420 295 L588 255 L740 225 L740 360 L84 360 Z" fill="url(#gb)"/>
<path d="M84 360 L252 350 L420 335 L588 320 L740 312 L740 360 L84 360 Z" fill="url(#gc)"/>

<g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path stroke="#34D399" d="M84 360 L252 320 L420 250 L588 175 L740 130"/>
  <path stroke="#5B8CFF" d="M84 360 L252 335 L420 295 L588 255 L740 225"/>
  <path stroke="#FB7185" d="M84 360 L252 350 L420 335 L588 320 L740 312" opacity=".85"/>
</g>

<g font-size="13" font-weight="700">
  <circle cx="740" cy="130" r="5" fill="#34D399" stroke="#0D1322" stroke-width="2"/>
  <text x="728" y="120" fill="#34D399" text-anchor="end">best  +38%</text>
  <circle cx="740" cy="225" r="5" fill="#5B8CFF" stroke="#0D1322" stroke-width="2"/>
  <text x="728" y="215" fill="#5B8CFF" text-anchor="end">middle  +23%</text>
  <circle cx="740" cy="312" r="5" fill="#FB7185" stroke="#0D1322" stroke-width="2"/>
  <text x="728" y="332" fill="#FB7185" text-anchor="end">low  +12%</text>
</g>

<!-- the year the curves separate, and why -->
<line x1="420" y1="250" x2="420" y2="104" stroke="#33406B" stroke-width="1" stroke-dasharray="3 4"/>
<circle cx="420" cy="250" r="4.5" fill="#EAEEF9" stroke="#0D1322" stroke-width="2"/>
<rect x="300" y="82" width="238" height="24" rx="12" fill="#141B2E" stroke="#232C45"/>
<text x="419" y="98" fill="#A3ADC9" font-size="12" text-anchor="middle">Y2: two cinemas added, inefficiencies fixed</text>

<rect x="84" y="400" width="672" height="28" rx="8" fill="#141B2E" stroke="#232C45"/>
<text x="100" y="419" fill="#A3ADC9" font-size="12">Even the low case clears the standalone plan, which is what made the funding case.</text>
</svg>
