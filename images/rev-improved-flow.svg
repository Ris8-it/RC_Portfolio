<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace" font-size="13">
<style>
g.arrow path{stroke-dasharray:6 6;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
rect.pulse{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{stroke-opacity:.5}50%{stroke-opacity:1}}
.pro{animation:rise 2.6s ease-in-out infinite}
@keyframes rise{0%,100%{opacity:.8}50%{opacity:1}}

.liveborder{fill:none;stroke:#4FD1C5;stroke-width:2.5;stroke-dasharray:14 10;
  filter:drop-shadow(0 0 6px rgba(79,209,197,.7));animation:march 3s linear infinite, pulse 2.4s ease-in-out infinite}
@keyframes march{to{stroke-dashoffset:-96}}
@keyframes pulse{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
</style>
<rect width="780" height="300" rx="14" fill="#11162B"/>
<rect class="liveborder" x="6" y="6" width="768" height="288" rx="12"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#4FD1C5"/></marker></defs>
<text x="390" y="36" fill="#E8EAF2" text-anchor="middle" font-size="16" font-weight="bold">Improved data flow</text>

<!-- Datasphere -->
<rect x="40" y="118" width="168" height="80" rx="12" fill="#1B2240" class="pulse" stroke="#8B9BFF" stroke-opacity=".6"/>
<text x="124" y="152" fill="#E8EAF2" text-anchor="middle" font-size="14">SAP Datasphere</text>
<text x="124" y="174" fill="#9AA3B8" text-anchor="middle" font-size="11">governed model</text>
<text x="124" y="222" fill="#9AA3B8" text-anchor="middle" font-size="10.5">deduplicated · star schema</text>

<!-- arrow 1 -->
<g class="arrow" stroke="#4FD1C5" stroke-opacity=".7" stroke-width="2" fill="none"><path d="M212 158 H252" marker-end="url(#a)"/></g>

<!-- Power BI -->
<rect x="256" y="118" width="168" height="80" rx="12" fill="#1B2240" class="pulse" stroke="#4FD1C5" stroke-opacity=".7"/>
<text x="340" y="152" fill="#4FD1C5" text-anchor="middle" font-size="14">Power BI</text>
<text x="340" y="174" fill="#9AA3B8" text-anchor="middle" font-size="11">live gateway</text>
<text x="340" y="222" fill="#9AA3B8" text-anchor="middle" font-size="10.5">fact + dimension tables</text>

<!-- arrow 2: from Power BI right edge to the middle pro box -->
<g class="arrow" stroke="#4FD1C5" stroke-opacity=".6" stroke-width="2" fill="none"><path d="M428 158 H470" marker-end="url(#a)"/></g>

<!-- three pros, vertically centered around y=158 -->
<g font-size="12.5">
<g class="pro"><rect x="474" y="100" width="262" height="34" rx="17" fill="#16223e" stroke="#4FD1C5" stroke-opacity=".4"/><text x="494" y="122" fill="#4FD1C5">&#10003;</text><text x="514" y="122" fill="#E8EAF2">daily data refresh</text></g>
<g class="pro" style="animation-delay:.6s"><rect x="474" y="141" width="262" height="34" rx="17" fill="#16223e" stroke="#4FD1C5" stroke-opacity=".4"/><text x="494" y="163" fill="#4FD1C5">&#10003;</text><text x="514" y="163" fill="#E8EAF2">YTD data</text></g>
<g class="pro" style="animation-delay:1.2s"><rect x="474" y="182" width="262" height="34" rx="17" fill="#16223e" stroke="#4FD1C5" stroke-opacity=".4"/><text x="494" y="204" fill="#4FD1C5">&#10003;</text><text x="514" y="204" fill="#E8EAF2">20+ report views</text></g>
</g>
</svg>
