<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace" font-size="13">
<style>
g.arrow path{stroke-dasharray:6 6;}
.liveborder{fill:none;stroke:#45454F;stroke-width:1;stroke-dasharray:none;
}
</style>
<rect width="780" height="300" rx="0" fill="#141417"/>
<rect class="liveborder" x="6" y="6" width="768" height="288" rx="0"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#F5A623"/></marker></defs>
<text x="390" y="36" fill="#EDEDF0" text-anchor="middle" font-size="16" font-weight="bold">Improved data flow</text>
<!-- Datasphere -->
<rect x="40" y="118" width="168" height="80" rx="0" fill="#1A1A1F" class="pulse" stroke="#9A9AA6" stroke-opacity="0.80"/>
<text x="124" y="152" fill="#EDEDF0" text-anchor="middle" font-size="14">SAP Datasphere</text>
<text x="124" y="174" fill="#9A9AA6" text-anchor="middle" font-size="11">governed model</text>
<text x="124" y="222" fill="#9A9AA6" text-anchor="middle" font-size="10.5">deduplicated · star schema</text>
<!-- arrow 1 -->
<g class="arrow" stroke="#F5A623" stroke-opacity="0.80" stroke-width="2" fill="none"><path d="M212 158 H252" marker-end="url(#a)"/></g>
<!-- Power BI -->
<rect x="256" y="118" width="168" height="80" rx="0" fill="#1A1A1F" class="pulse" stroke="#45454F" stroke-opacity="0.80"/>
<text x="340" y="152" fill="#9A9AA6" text-anchor="middle" font-size="14">Power BI</text>
<text x="340" y="174" fill="#9A9AA6" text-anchor="middle" font-size="11">live gateway</text>
<text x="340" y="222" fill="#9A9AA6" text-anchor="middle" font-size="10.5">fact + dimension tables</text>
<!-- arrow 2: from Power BI right edge to the middle pro box -->
<g class="arrow" stroke="#F5A623" stroke-opacity="0.80" stroke-width="2" fill="none"><path d="M428 158 H470" marker-end="url(#a)"/></g>
<!-- three pros, vertically centered around y=158 -->
<g font-size="12.5">
<g class="pro"><rect x="474" y="100" width="262" height="34" rx="0" fill="#1A1A1F" stroke="#45454F" stroke-opacity="0.80"/><text x="494" y="122" fill="#9A9AA6">&#10003;</text><text x="514" y="122" fill="#EDEDF0">daily data refresh</text></g>
<g class="pro" style=""><rect x="474" y="141" width="262" height="34" rx="0" fill="#1A1A1F" stroke="#45454F" stroke-opacity="0.80"/><text x="494" y="163" fill="#9A9AA6">&#10003;</text><text x="514" y="163" fill="#EDEDF0">YTD data</text></g>
<g class="pro" style=""><rect x="474" y="182" width="262" height="34" rx="0" fill="#1A1A1F" stroke="#45454F" stroke-opacity="0.80"/><text x="494" y="204" fill="#9A9AA6">&#10003;</text><text x="514" y="204" fill="#EDEDF0">20+ report views</text></g>
</g>
</svg>
