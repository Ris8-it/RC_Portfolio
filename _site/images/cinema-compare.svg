<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
<defs>
<linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FD1C5" stop-opacity=".28"/><stop offset="1" stop-color="#4FD1C5" stop-opacity="0"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B9BFF" stop-opacity=".22"/><stop offset="1" stop-color="#8B9BFF" stop-opacity="0"/></linearGradient>
<linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0A8A8" stop-opacity=".18"/><stop offset="1" stop-color="#F0A8A8" stop-opacity="0"/></linearGradient>
<style>.ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s cubic-bezier(.25,.8,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}</style>
</defs>
<rect width="800" height="440" rx="14" fill="#11162B"/>
<text x="40" y="34" fill="#E8EAF2" font-size="15" font-weight="bold">Projected performance after the deal</text>
<text x="40" y="54" fill="#9AA3B8" font-size="11">Indexed vs the original standalone case (Year 0 = 100) · three scenarios</text>
<!-- axes -->
<line x1="70" y1="90" x2="70" y2="360" stroke="#3a4668" stroke-width="1.4"/>
<line x1="70" y1="360" x2="760" y2="360" stroke="#3a4668" stroke-width="1.4"/>
<text x="26" y="230" fill="#6b7394" font-size="10" transform="rotate(-90 26 230)">cash flow (indexed)</text>
<!-- y ticks -->
<g stroke="#222a44" stroke-width="1"><line x1="70" y1="300" x2="760" y2="300"/><line x1="70" y1="240" x2="760" y2="240"/><line x1="70" y1="180" x2="760" y2="180"/><line x1="70" y1="120" x2="760" y2="120"/></g>
<g fill="#6b7394" font-size="9" text-anchor="end"><text x="62" y="363">100</text><text x="62" y="303">110</text><text x="62" y="243">120</text><text x="62" y="183">130</text><text x="62" y="123">140</text></g>
<!-- x ticks: years -->
<g fill="#6b7394" font-size="10" text-anchor="middle"><text x="70" y="378">Y0</text><text x="242" y="378">Y1</text><text x="414" y="378">Y2</text><text x="586" y="378">Y3</text><text x="758" y="378">Y4</text></g>
<!-- shaded areas under each line -->
<path d="M70 360 L242 320 L414 250 L586 175 L758 130 L758 360 L70 360 Z" fill="url(#g1)"/>
<path d="M70 360 L242 335 L414 295 L586 255 L758 225 L758 360 L70 360 Z" fill="url(#g2)"/>
<path d="M70 360 L242 350 L414 335 L586 320 L758 312 L758 360 L70 360 Z" fill="url(#g3)"/>
<!-- lines -->
<path class="ln" stroke="#4FD1C5" d="M70 360 L242 320 L414 250 L586 175 L758 130"/>
<path class="ln" stroke="#8B9BFF" d="M70 360 L242 335 L414 295 L586 255 L758 225" style="animation-delay:.2s"/>
<path class="ln" stroke="#F0A8A8" d="M70 360 L242 350 L414 335 L586 320 L758 312" style="animation-delay:.4s"/>
<!-- end labels with % uplift -->
<g font-size="11" font-weight="bold">
<circle cx="758" cy="130" r="4" fill="#4FD1C5"/><text x="690" y="122" fill="#4FD1C5">best +38%</text>
<circle cx="758" cy="225" r="4" fill="#8B9BFF"/><text x="688" y="218" fill="#8B9BFF">middle +23%</text>
<circle cx="758" cy="312" r="4" fill="#F0A8A8"/><text x="700" y="328" fill="#F0A8A8">low +12%</text>
</g>
<!-- annotation: connected-set effect -->
<line x1="414" y1="250" x2="414" y2="90" stroke="#4FD1C5" stroke-dasharray="3 3" stroke-width="1" opacity=".5"/>
<text x="420" y="100" fill="#9AA3B8" font-size="10">Y2: two cinemas added,</text>
<text x="420" y="114" fill="#9AA3B8" font-size="10">inefficiencies fixed</text>
</svg>
