project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "projects/*.qmd"
    # templates/ holds an internal documentation skeleton whose image paths are
    # placeholders. It was being published as an orphan page with broken images.
    - "!templates/**"
  resources:
    # quarto.js fetches listings.json on any page carrying `categories`, whether or
    # not the site has a listing. The projects page is hand built now, so nothing
    # generates the file and every case study logged a 404 for it. An empty array
    # is what that code path expects to find when there is nothing to activate.
    - listings.json

website:
  title: "Riccardo Cammarata"
  description: "Financial data engineering. I rebuild reporting that still runs on files pulled by hand."
  favicon: images/favicon.png
  navbar:
    pinned: true
    logo: images/riccardo.jpg
    left:
      - href: index.qmd
        text: Home
      - href: projects/index.qmd
        text: Projects
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/Ris8-it
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/riccardo-cammarata-00s
        aria-label: LinkedIn
  page-footer:
    left: "Riccardo Cammarata · Amsterdam"
    right: "riccardocammarata00@gmail.com"

format:
  html:
    theme: [styles/theme.scss]
    toc: false
    anchor-sections: false
    include-in-header: assets/head.html
    include-after-body: assets/after-body.html
    smooth-scroll: true
